[colors]
background = #1F1F28
background-alt = #2A2A37
foreground = #DCD7BA
primary = #7E9CD8
secondary = #658589
alert = #E82424
disabled = #727169

[bar/mybar]
;override-redirect = true
wm-restack = bspwm
override-redirect = true
monitor = DP-1-2
width = 100%
height = 20px
margin-top = 0
margin-bottom = 0

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 1pt

border-top-size = 5pt
border-left-size = 6pt
border-right-size = 6pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = IBM Plex Mono;2
font-1 = Font Awesome 6 Brands;2
font-2 = Font Awesome 6 Free;2
font-3 = Font Awesome v4 Compatibility;2
font-4 = Symbols Nerd Font:style=1000-em;2
font-5 = Source Han Sans;2
;font-6 = IPAGothic;2

modules-left = widget-external xworkspaces xwindow
modules-right = spotify spotify-prev spotify-play-pause spotify-next external-backlight battery memory cpu date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; tray-position = right

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[bar/mybar-internal]
;override-redirect = true
wm-restack = bspwm
override-redirect = true
width = 100%
height = 20px
margin-top = 0
margin-bottom = 0
monitor = eDP1

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 1pt

border-left-size = 6pt
border-right-size = 6pt
border-top-size = 5pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = IBM Plex Mono;2
font-1 = Font Awesome 6 Brands;2
font-2 = Font Awesome 6 Free;2
font-3 = Font Awesome v4 Compatibility;2
font-4 = Symbols Nerd Font:style=1000-em;2
font-5 = Source Han Sans;2
;font-6 = IPAGothic;2

modules-left = widget bspwm xwindow
modules-right = cpu backlight battery date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/widget]
type = custom/script
exec = echo ' 浪'
click-left = ./eww/target/release/eww open --toggle myWidge

[module/widget-external]
type = custom/script
exec = echo ' 浪'
;click-left = ./eww/target/release/eww open --toggle cal-win & ./eww/target/release/eww open --toggle systempanel
click-left = ./eww/target/release/eww open --toggle myWidge

[module/bspwm]
type = internal/bspwm

pin-workspaces = true
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

;[module/filesystem]
;type = internal/fs
;interval = 25

;mount-0 = /

;label-mounted = %{F#F0C674}%mountpoint%%{F-} %percentage_used%%

;label-unmounted = %mountpoint% not mounted
;label-unmounted-foreground = ${colors.disabled}

[module/spotify]
type = custom/script
tail = true
; prefix symbol is shown before the text
format-prefix = " "
format = <label>
exec = ~/.config/polybar/scripts/scroll_spotify_status.sh

[module/spotify-prev]
type = custom/script
exec = echo "󰒮"
format = <label>
click-left = playerctl previous -p spotify

[module/spotify-play-pause]
type = custom/ipc
hook-0 = echo "󰏤"
hook-1 = echo "󰐊"
initial = 1
click-left = playerctl play-pause -p spotify

[module/spotify-next]
type = custom/script
exec = echo "󰒭"
format = <label>
click-left = playerctl next -p spotify

[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true
format = <bar>
bar-width = 10
bar-indicator = |
bar-fill = ─
bar-empty = ─

[module/external-backlight]
type = internal/backlight
card = ddcci4
use-actual-brightness = true
enable-scroll = true
;format = <bar>
;bar-width = 10
;bar-indicator = |
;bar-fill = ─
;bar-empty = ─

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.primary}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/battery]
type = internal/battery

; This is useful in case the battery never reports 100% charge
; Default: 100
;full-at = 99

; format-low once this charge percentage is reached
; Default: 10
; New in version 3.6.0
low-at = 20

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT0
adapter = AC

; Default: 5
poll-interval = 5
format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>
format-low = <animation-low> <label-low>

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
label-discharging = %percentage%%
label-full = %percentage%%

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750
label-charging = %percentage%%

animation-low-0 = 
animation-low-1 = !
animation-low-framerate = 500
label-low = BATTERY LOW (%percentage%%)

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

;[network-base]
;type = internal/network
;interval = 5
;format-connected = <label-connected>
;format-disconnected = <label-disconnected>
;label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

;[module/wlan]
;inherit = network-base
;interface-type = wireless
;label-connected = %{F#F0C674}%ifname%%{F-} %essid% %local_ip%

;[module/eth]
;inherit = network-base
;interface-type = wired
;label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %m.%d.%a %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
